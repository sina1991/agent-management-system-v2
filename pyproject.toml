[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-management-system-v2"
version = "0.4.0.dev0"
description = "Repository-embedded agent and task management system"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14.1,<3", "SQLAlchemy>=2.1.6,<3", "alembic>=1.20.1,<2"]

[project.scripts]
ams = "agent_system.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
