name: Core CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -c requirements.lock.txt .
      - name: Test contracts, lifecycle and SQLite transactions
        run: python -m unittest discover -s tests -v
      - name: Check installed entry point
        working-directory: /tmp
        run: |
          ams --version
          ams status
          ams schema Task > /tmp/ams-task-schema.json
          ams db init /tmp/ams-ci/system.db
          ams db verify /tmp/ams-ci/system.db
